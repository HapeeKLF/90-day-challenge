<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>90-Day Challenge</title>
  <meta name="description" content="Build good habits, break bad ones, train every day — 90 days.">
  <meta name="theme-color" content="#0d1220">
  <!-- Lets it work like an app when added to the home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="90 Days">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">90-Day Challenge</div>
      <div class="sub" id="topSub">Let's go</div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙️</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="active"><span>✅</span>Today</button>
    <button data-tab="workout"><span>💪</span>Workout</button>
    <button data-tab="schedule"><span>🕒</span>Schedule</button>
    <button data-tab="rewards"><span>🎁</span>Rewards</button>
    <button data-tab="progress"><span>📈</span>Progress</button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="sheet" id="sheet"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
